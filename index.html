
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zare AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 100%;
      max-width: 850px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      background: #111827;
      border: 1px solid #273449;
      border-radius: 18px;
      overflow: hidden;
    }
    header {
      padding: 20px;
      border-bottom: 1px solid #273449;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      background: #7c3aed;
      width: 45px;
      height: 45px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 25px;
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; color: #9ca3af; font-size: 13px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { align-self: flex-start; background: #202b40; }
    .user { align-self: flex-end; background: #6d28d9; }
    .label { font-size: 11px; color: #c4b5fd; margin-bottom: 5px; }
    form {
      display: flex;
      gap: 10px;
      padding: 18px;
      border-top: 1px solid #273449;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #374151;
      outline: none;
      background: #0b1020;
      color: white;
      font-size: 15px;
    }
    button {
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: #7c3aed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #6d28d9; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { color: #9ca3af; font-size: 12px; padding: 0 20px 12px; }
    @media (max-width: 600px) {
      .app { height: 100vh; border-radius: 0; }
      form { padding: 12px; }
      #chat { padding: 14px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">✦</div>
      <div>
        <h1>Zare AI</h1>
        <p>Tu asistente personal</p>
      </div>
    </header>

    <section id="chat">
      <div class="message bot">
        <div class="label">ZARE</div>
        ¡Hola! Soy Zare. 💜 Ya estoy lista para conversar contigo. ¿Qué quieres saber?
      </div>
    </section>

    <div id="status">Conectada al servidor · Lista para conversar.</div>

    <form id="form">
      <input id="message" placeholder="Escribe un mensaje..." autocomplete="off" required>
      <button id="send" type="submit">Enviar</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    const history = [];

    function addMessage(text, type) {
      const bubble = document.createElement("div");
      bubble.className = "message " + type;

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = type === "user" ? "TÚ" : "ZARE";

      const content = document.createElement("div");
      content.textContent = text;

      bubble.append(label, content);
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return content;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || send.disabled) return;

      addMessage(text, "user");
      history.push({ role: "user", content: text });

      input.value = "";
      send.disabled = true;
      status.textContent = "Zare está pensando...";

      const replyBubble = addMessage("Estoy pensando...", "bot");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "No se pudo conectar con la IA.");
        }

        const reply = data.reply || "No recibí una respuesta.";
        replyBubble.textContent = reply;
        history.push({ role: "assistant", content: reply });
        status.textContent = "Zare está lista.";
      } catch (error) {
        replyBubble.textContent = "No pude responder: " + error.message;
        status.textContent = "Hubo un problema. Revisa el servidor de Zare.";
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    });
  </script>
</body>
</html>
