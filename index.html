<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zare AI</title>
  <meta name="theme-color" content="#111111">
  <style>
    :root{color-scheme:dark;--bg:#212121;--sidebar:#171717;--border:#383838;--text:#f5f5f5;--muted:#a0a0a0;--accent:#10a37f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
    button,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:700;letter-spacing:-.8px}
    .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent);color:white;font-weight:800}
    .muted{color:var(--muted)}

    #loginScreen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#183b35,#111 60%)}
    .login-card{width:min(100%,420px);padding:32px;border:1px solid #383838;border-radius:24px;background:#191919;text-align:center;box-shadow:0 24px 80px #0007}
    .login-card .logo{margin:0 auto 18px;width:58px;height:58px;font-size:25px}
    .login-card h1{margin:0 0 8px;font-size:30px}.login-card p{color:var(--muted);margin:0 0 24px}
    .google-button{width:100%;display:flex;justify-content:center;align-items:center;gap:12px;padding:13px;border:1px solid #555;border-radius:12px;background:#f7f7f7;color:#222;font-weight:650}
    .google-button:disabled{opacity:.6;cursor:wait}.login-status{min-height:24px;margin-top:16px;color:#ffaaaa;font-size:13px;overflow-wrap:anywhere}
    .account-button{border:1px solid #444;border-radius:10px;background:#252525;color:#eee;padding:7px 11px}
    .app{height:100dvh;display:flex;overflow:hidden}
    .sidebar{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;padding:18px 14px;background:var(--sidebar);border-right:1px solid #303030;overflow:auto}
    .sidebar.closed{display:none}
    #history{display:flex;flex-direction:column;gap:3px}
    .sidebar .brand{padding:5px 7px 12px}
    .side-button{padding:11px 12px;border:1px solid #3c3c3c;border-radius:12px;background:transparent;color:var(--text);text-align:left}
    .side-button:hover,.history-item:hover{background:#292929}
    .history-title{margin:15px 8px 0;font-size:12px;color:var(--muted)}
    .history-item{display:block;width:100%;padding:9px;border:0;border-radius:9px;background:transparent;color:#ddd;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}
    .topbar{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #292929}
    .mobile-menu{display:inline-block;border:0;background:none;color:white;font-size:22px}
    .conversation{flex:1;min-height:0;overflow-y:auto;padding:28px 20px 20px}
    .welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:45px}
    .welcome h1{margin:0 0 8px;font-size:clamp(28px,4vw,38px);letter-spacing:-1.2px}
    .welcome p{color:var(--muted)}
    .suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:600px;margin-top:18px}
    .suggestion{padding:10px 13px;border:1px solid #414141;border-radius:18px;background:transparent;color:#ddd}
    .suggestion:hover{background:#303030}
    .messages{width:min(100%,780px);margin:0 auto;display:flex;flex-direction:column;gap:25px}
    .message-row{display:flex;gap:13px}.message-row.user{justify-content:flex-end}
    .bubble{max-width:85%;padding:12px 16px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap}
    .code-block{max-width:100%;margin:12px 0;border:1px solid #444;border-radius:12px;overflow:hidden;background:#111}
    .code-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;background:#252525;color:#bbb;font-size:12px}
    .copy-code{border:1px solid #555;border-radius:8px;padding:5px 10px;background:#333;color:#fff;font-size:12px}
    .copy-code:hover{background:#444}
    .code-block pre{margin:0;padding:14px;overflow:auto;white-space:pre}
    .code-block code{font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:#e8e8e8}
    .assistant .bubble{white-space:normal}
    .assistant .bubble .plain-text{white-space:pre-wrap}
    .user .bubble{background:#303030}.assistant .bubble{padding-left:0}
    .avatar{flex-shrink:0;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--accent);font-size:12px;font-weight:bold}
    .composer-area{flex-shrink:0;padding:10px 20px 20px;background:linear-gradient(transparent,var(--bg) 15%)}
    .composer{width:min(100%,780px);margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 17px;border:1px solid #484848;border-radius:24px;background:#303030;box-shadow:0 8px 30px #0002}
    .composer textarea{flex:1;min-width:0;max-height:180px;resize:none;border:0;outline:0;padding:8px 0;background:transparent;color:white}
    .send{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:white;color:#171717;font-size:20px;font-weight:bold}
    .send:disabled{opacity:.45}.disclaimer{margin:8px 0 0;text-align:center;color:var(--muted);font-size:11px}
    .status{width:min(100%,780px);margin:0 auto 8px;color:#ffaaaa;font-size:13px}
    .sidebar-footer{margin-top:auto;border-top:1px solid #333;padding:12px 8px;color:var(--muted);font-size:12px}
    @media(max-width:700px){.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:260px;transform:translateX(-105%);transition:transform .2s ease;box-shadow:10px 0 35px #0005}.sidebar.open{transform:translateX(0);display:flex}.mobile-menu{display:inline-block}.topbar{padding:0 14px}.conversation{padding:20px 14px}.composer-area{padding:8px 10px 12px}}
  </style>
</head>
<body>
  <section id="loginScreen">
    <div class="login-card">
      <div class="logo">Z</div>
      <h1>Bienvenido a Zare AI</h1>
      <p>Inicia sesión con tu cuenta de Google para continuar.</p>
      <button id="googleLogin" class="google-button" type="button"><span style="font-size:20px;font-weight:800">G</span> Continuar con Google</button>
      <div id="loginStatus" class="login-status" role="status"></div>
    </div>
  </section>
  <section id="chatApp" class="app hidden"> class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><div class="logo">Z</div><span>Zare AI</span></div>
      <button id="newChat" class="side-button" type="button">＋ Nuevo chat</button>
      <div class="history-title">Tus conversaciones</div>
      <div id="history"></div>
      <div class="sidebar-footer">Sesión protegida con Google</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menuButton" class="mobile-menu" type="button" aria-label="Abrir menú">☰</button>
        <strong>Zare AI <span class="muted">⌄</span></strong>
        <div style="display:flex;align-items:center;gap:10px"><span id="userEmail" class="muted"></span><button id="logoutButton" class="account-button" type="button">Salir</button></div>
      </header>
      <section id="conversation" class="conversation">
        <div id="welcome" class="welcome">
          <h1>¿En qué puedo ayudarte?</h1>
          <p>Pregunta, crea, aprende y explora con Zare.</p>
          <div class="suggestions">
            <button class="suggestion" type="button">Dame ideas creativas</button>
            <button class="suggestion" type="button">Ayúdame a programar</button>
            <button class="suggestion" type="button">Explícame algo difícil</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </section>
      <div class="composer-area">
        <div id="status" class="status" role="status"></div>
        <form id="chatForm" class="composer">
          <textarea id="prompt" rows="1" maxlength="12000" placeholder="Escribe un mensaje a Zare..." aria-label="Escribe un mensaje" required></textarea>
          <button id="sendButton" class="send" type="submit" aria-label="Enviar mensaje">↑</button>
        </form>
        <p class="disclaimer">Zare puede cometer errores. Comprueba la información importante.</p>
      </div>
    </main>
  </section>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "zare_ai_conversations_v1";
      let conversations = loadConversations();
      let activeConversationId = conversations[0]?.id || null;
      let busy = false;
      let firebaseAuth = null;
      let firebaseUser = null;
      const $ = id => document.getElementById(id);

      async function setupFirebase() {
        try {
          const response = await fetch("/api/config");
          const configData = await response.json();
          if (!response.ok || !configData.firebaseConfig) throw new Error(configData.error || "No se pudo cargar Firebase.");
          if (!firebase.apps.length) firebase.initializeApp(configData.firebaseConfig);
          firebaseAuth = firebase.auth();
          firebaseAuth.onAuthStateChanged(user => {
            firebaseUser = user;
            $("loginScreen").classList.toggle("hidden", Boolean(user));
            $("chatApp").classList.toggle("hidden", !user);
            $("userEmail").textContent = user?.email || "";
            if (user) {
              $("loginStatus").textContent = "";
              renderHistory();
              if (activeConversationId) renderConversation();
            }
          });
        } catch (error) {
          $("loginStatus").textContent = error.message || "No se pudo conectar con Firebase.";
        }
      }

      $("googleLogin").addEventListener("click", async () => {
        if (!firebaseAuth) return $("loginStatus").textContent = "Firebase todavía está cargando. Inténtalo otra vez.";
        $("googleLogin").disabled = true;
        $("loginStatus").textContent = "Abriendo el inicio de sesión de Google...";
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          await firebaseAuth.signInWithPopup(provider);
        } catch (error) {
          $("loginStatus").textContent = error.code === "auth/popup-closed-by-user"
            ? "Cerraste la ventana de Google antes de iniciar sesión."
            : (error.message || "No se pudo iniciar sesión con Google.");
        } finally {
          $("googleLogin").disabled = false;
        }
      });

      $("logoutButton").addEventListener("click", async () => {
        try { if (firebaseAuth) await firebaseAuth.signOut(); }
        catch (error) { showStatus("No se pudo cerrar sesión: " + error.message, true); }
      });

      function loadConversations() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved) ? saved.filter(c => c && c.id && Array.isArray(c.messages)) : [];
        } catch { return []; }
      }

      function saveConversations() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations)); }
        catch { showStatus("No se pudieron guardar los chats en este navegador.", true); }
      }

      function showStatus(message, error = false) {
        $("status").textContent = message;
        $("status").style.color = error ? "#ff8b8b" : "#b7e6d5";
      }

      function newConversation() {
        const conversation = { id: crypto.randomUUID(), title: "Nuevo chat", messages: [] };
        conversations.unshift(conversation);
        activeConversationId = conversation.id;
        saveConversations();
        renderConversation();
        renderHistory();
        $("prompt").focus();
        $("sidebar").classList.remove("open");
      }

      function renderHistory() {
        const container = $("history");
        container.replaceChildren();
        conversations.forEach(conversation => {
          const button = document.createElement("button");
          button.className = "history-item" + (conversation.id === activeConversationId ? " active" : "");
          button.textContent = conversation.title;
          button.title = conversation.title;
          button.addEventListener("click", () => {
            activeConversationId = conversation.id;
            renderHistory();
            renderConversation();
            $("sidebar").classList.remove("open");
          });
          container.appendChild(button);
        });
      }

      function renderConversation() {
        const conversation = conversations.find(item => item.id === activeConversationId);
        $("messages").replaceChildren();
        $("welcome").classList.toggle("hidden", Boolean(conversation && conversation.messages.length));
        if (!conversation) return;
        conversation.messages.forEach(message => addMessageToUI(message.role, message.content));
        $("conversation").scrollTop = $("conversation").scrollHeight;
      }

      function renderAssistantContent(container, content) {
        // Reconoce bloques Markdown ```lang ... ``` y añade copiar sin ejecutar código.
        const pattern = /```([^\n`]*)\n([\s\S]*?)```/g;
        let lastIndex = 0;
        let match;
        while ((match = pattern.exec(content)) !== null) {
          if (match.index > lastIndex) {
            const textNode = document.createElement("div");
            textNode.className = "plain-text";
            textNode.textContent = content.slice(lastIndex, match.index);
            container.appendChild(textNode);
          }

          const language = (match[1] || "").trim() || "código";
          const codeText = match[2].replace(/\n$/, "");
          const block = document.createElement("div");
          block.className = "code-block";

          const toolbar = document.createElement("div");
          toolbar.className = "code-toolbar";

          const languageLabel = document.createElement("span");
          languageLabel.textContent = language;
          toolbar.appendChild(languageLabel);

          const copyButton = document.createElement("button");
          copyButton.type = "button";
          copyButton.className = "copy-code";
          copyButton.textContent = "📋 Copiar código";
          copyButton.addEventListener("click", async () => {
            try {
              if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(codeText);
              } else {
                const temporary = document.createElement("textarea");
                temporary.value = codeText;
                temporary.style.position = "fixed";
                temporary.style.opacity = "0";
                document.body.appendChild(temporary);
                temporary.select();
                const copied = document.execCommand("copy");
                temporary.remove();
                if (!copied) throw new Error("No se pudo copiar");
              }
              copyButton.textContent = "✓ Copiado";
              setTimeout(() => { copyButton.textContent = "📋 Copiar código"; }, 1600);
            } catch {
              copyButton.textContent = "No se pudo copiar";
              setTimeout(() => { copyButton.textContent = "📋 Copiar código"; }, 1600);
            }
          });
          toolbar.appendChild(copyButton);

          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = codeText;
          pre.appendChild(code);
          block.append(toolbar, pre);
          container.appendChild(block);
          lastIndex = pattern.lastIndex;
        }

        if (lastIndex < content.length || lastIndex === 0) {
          const textNode = document.createElement("div");
          textNode.className = "plain-text";
          textNode.textContent = content.slice(lastIndex);
          container.appendChild(textNode);
        }
      }

      function addMessageToUI(role, content) {
        $("welcome").classList.add("hidden");
        const row = document.createElement("div");
        row.className = "message-row " + (role === "user" ? "user" : "assistant");
        if (role === "assistant") {
          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = "Z";
          row.appendChild(avatar);
        }
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (role === "assistant") renderAssistantContent(bubble, content);
        else bubble.textContent = content;
        row.appendChild(bubble);
        $("messages").appendChild(row);
        $("conversation").scrollTop = $("conversation").scrollHeight;
      }

      $("newChat").addEventListener("click", newConversation);
      // Mostrar el historial y restaurar la última conversación guardada.
      renderHistory();
      if (activeConversationId) renderConversation();
      setupFirebase();
      document.querySelectorAll(".suggestion").forEach(button => {
        button.addEventListener("click", () => {
          $("prompt").value = button.textContent;
          $("prompt").focus();
        });
      });
      $("menuButton").addEventListener("click", () => $("sidebar").classList.toggle("open"));
      $("prompt").addEventListener("input", () => {
        const field = $("prompt");
        field.style.height = "auto";
        field.style.height = Math.min(field.scrollHeight, 180) + "px";
      });
      $("prompt").addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          $("chatForm").requestSubmit();
        }
      });

      $("chatForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;
        const prompt = $("prompt").value.trim();
        if (!prompt) return;
        if (!activeConversationId) newConversation();
        const conversation = conversations.find(item => item.id === activeConversationId);
        if (!conversation) return;

        busy = true;
        $("sendButton").disabled = true;
        $("prompt").value = "";
        $("prompt").style.height = "auto";
        showStatus("");
        conversation.messages.push({ role: "user", content: prompt });
        saveConversations();
        if (conversation.title === "Nuevo chat") {
          conversation.title = prompt.slice(0, 32);
          renderHistory();
        }
        renderConversation();

        const loadingRow = document.createElement("div");
        loadingRow.className = "message-row assistant";
        const loadingAvatar = document.createElement("div");
        loadingAvatar.className = "avatar";
        loadingAvatar.textContent = "Z";
        loadingRow.appendChild(loadingAvatar);
        const loadingBubble = document.createElement("div");
        loadingBubble.className = "bubble";
        loadingBubble.textContent = "Zare está pensando...";
        loadingRow.appendChild(loadingBubble);
        $("messages").appendChild(loadingRow);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + await firebaseUser.getIdToken() },
            body: JSON.stringify({ messages: conversation.messages })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Error del servidor.");
          conversation.messages.push({ role: "assistant", content: data.reply || "No recibí una respuesta." });
          saveConversations();
        } catch (error) {
          conversation.messages.push({ role: "assistant", content: "No pude responder: " + error.message });
          saveConversations();
        } finally {
          busy = false;
          $("sendButton").disabled = false;
          renderConversation();
        }
      });
    })();
  </script>
</body>
</html>
