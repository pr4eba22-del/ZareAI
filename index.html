<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zare AI</title>
  <meta name="theme-color" content="#111111">
  <style>
    :root{color-scheme:dark;--bg:#212121;--sidebar:#171717;--border:#383838;--text:#f5f5f5;--muted:#a0a0a0;--accent:#10a37f}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
    button,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:700;letter-spacing:-.8px}
    .logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent);color:white;font-weight:800}
    .muted{color:var(--muted)}
    .app{height:100dvh;display:flex;overflow:hidden}
    .sidebar{width:260px;flex-shrink:0;padding:16px 12px;display:flex;flex-direction:column;gap:12px;background:var(--sidebar);border-right:1px solid #282828}
    .sidebar .brand{padding:5px 7px 12px}
    .side-button{padding:11px 12px;border:1px solid #3c3c3c;border-radius:12px;background:transparent;color:var(--text);text-align:left}
    .side-button:hover,.history-item:hover{background:#292929}
    .history-title{margin:15px 8px 0;font-size:12px;color:var(--muted)}
    .history-item{display:block;width:100%;padding:9px;border:0;border-radius:9px;background:transparent;color:#ddd;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    .main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}
    .topbar{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #292929}
    .mobile-menu{display:none;border:0;background:none;color:white;font-size:22px}
    .conversation{flex:1;min-height:0;overflow-y:auto;padding:28px 20px 20px}
    .welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:45px}
    .welcome h1{margin:0 0 8px;font-size:clamp(28px,4vw,38px);letter-spacing:-1.2px}
    .welcome p{color:var(--muted)}
    .suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:600px;margin-top:18px}
    .suggestion{padding:10px 13px;border:1px solid #414141;border-radius:18px;background:transparent;color:#ddd}
    .suggestion:hover{background:#303030}
    .messages{width:min(100%,780px);margin:0 auto;display:flex;flex-direction:column;gap:25px}
    .message-row{display:flex;gap:13px}.message-row.user{justify-content:flex-end}
    .bubble{max-width:85%;padding:12px 16px;border-radius:18px;overflow-wrap:anywhere;white-space:pre-wrap}
    .user .bubble{background:#303030}.assistant .bubble{padding-left:0}
    .avatar{flex-shrink:0;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--accent);font-size:12px;font-weight:bold}
    .composer-area{flex-shrink:0;padding:10px 20px 20px;background:linear-gradient(transparent,var(--bg) 15%)}
    .composer{width:min(100%,780px);margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 17px;border:1px solid #484848;border-radius:24px;background:#303030;box-shadow:0 8px 30px #0002}
    .composer textarea{flex:1;min-width:0;max-height:180px;resize:none;border:0;outline:0;padding:8px 0;background:transparent;color:white}
    .send{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:white;color:#171717;font-size:20px;font-weight:bold}
    .send:disabled{opacity:.45}.disclaimer{margin:8px 0 0;text-align:center;color:var(--muted);font-size:11px}
    .status{width:min(100%,780px);margin:0 auto 8px;color:#ffaaaa;font-size:13px}
    .sidebar-footer{margin-top:auto;border-top:1px solid #333;padding:12px 8px;color:var(--muted);font-size:12px}
    @media(max-width:700px){.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;transform:translateX(-105%);transition:transform .2s ease;box-shadow:10px 0 35px #0005}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-block}.topbar{padding:0 14px}.conversation{padding:20px 14px}.composer-area{padding:8px 10px 12px}}
  </style>
</head>
<body>
  <section id="chatApp" class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><div class="logo">Z</div><span>Zare AI</span></div>
      <button id="newChat" class="side-button" type="button">＋ Nuevo chat</button>
      <div class="history-title">Tus conversaciones</div>
      <div id="history"></div>
      <div class="sidebar-footer">Sin cuenta ni correo electrónico</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menuButton" class="mobile-menu" type="button" aria-label="Abrir menú">☰</button>
        <strong>Zare AI <span class="muted">⌄</span></strong>
        <span class="muted">Asistente personal</span>
      </header>
      <section id="conversation" class="conversation">
        <div id="welcome" class="welcome">
          <h1>¿En qué puedo ayudarte?</h1>
          <p>Pregunta, crea, aprende y explora con Zare.</p>
          <div class="suggestions">
            <button class="suggestion" type="button">Dame ideas creativas</button>
            <button class="suggestion" type="button">Ayúdame a programar</button>
            <button class="suggestion" type="button">Explícame algo difícil</button>
          </div>
        </div>
        <div id="messages" class="messages"></div>
      </section>
      <div class="composer-area">
        <div id="status" class="status" role="status"></div>
        <form id="chatForm" class="composer">
          <textarea id="prompt" rows="1" maxlength="12000" placeholder="Escribe un mensaje a Zare..." aria-label="Escribe un mensaje" required></textarea>
          <button id="sendButton" class="send" type="submit" aria-label="Enviar mensaje">↑</button>
        </form>
        <p class="disclaimer">Zare puede cometer errores. Comprueba la información importante.</p>
      </div>
    </main>
  </section>
  <script>
    (() => {
      "use strict";
      let conversations = [];
      let activeConversationId = null;
      let busy = false;
      const $ = id => document.getElementById(id);

      function showStatus(message, error = false) {
        $("status").textContent = message;
        $("status").style.color = error ? "#ff8b8b" : "#b7e6d5";
      }

      function newConversation() {
        const conversation = { id: crypto.randomUUID(), title: "Nuevo chat", messages: [] };
        conversations.unshift(conversation);
        activeConversationId = conversation.id;
        renderConversation();
        renderHistory();
        $("prompt").focus();
        $("sidebar").classList.remove("open");
      }

      function renderHistory() {
        const container = $("history");
        container.replaceChildren();
        conversations.forEach(conversation => {
          const button = document.createElement("button");
          button.className = "history-item";
          button.textContent = conversation.title;
          button.title = conversation.title;
          button.addEventListener("click", () => {
            activeConversationId = conversation.id;
            renderConversation();
            $("sidebar").classList.remove("open");
          });
          container.appendChild(button);
        });
      }

      function renderConversation() {
        const conversation = conversations.find(item => item.id === activeConversationId);
        $("messages").replaceChildren();
        $("welcome").classList.toggle("hidden", Boolean(conversation && conversation.messages.length));
        if (!conversation) return;
        conversation.messages.forEach(message => addMessageToUI(message.role, message.content));
        $("conversation").scrollTop = $("conversation").scrollHeight;
      }

      function addMessageToUI(role, content) {
        $("welcome").classList.add("hidden");
        const row = document.createElement("div");
        row.className = "message-row " + (role === "user" ? "user" : "assistant");
        if (role === "assistant") {
          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = "Z";
          row.appendChild(avatar);
        }
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;
        row.appendChild(bubble);
        $("messages").appendChild(row);
        $("conversation").scrollTop = $("conversation").scrollHeight;
      }

      $("newChat").addEventListener("click", newConversation);
      document.querySelectorAll(".suggestion").forEach(button => {
        button.addEventListener("click", () => {
          $("prompt").value = button.textContent;
          $("prompt").focus();
        });
      });
      $("menuButton").addEventListener("click", () => $("sidebar").classList.toggle("open"));
      $("prompt").addEventListener("input", () => {
        const field = $("prompt");
        field.style.height = "auto";
        field.style.height = Math.min(field.scrollHeight, 180) + "px";
      });
      $("prompt").addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          $("chatForm").requestSubmit();
        }
      });

      $("chatForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;
        const prompt = $("prompt").value.trim();
        if (!prompt) return;
        if (!activeConversationId) newConversation();
        const conversation = conversations.find(item => item.id === activeConversationId);
        if (!conversation) return;

        busy = true;
        $("sendButton").disabled = true;
        $("prompt").value = "";
        $("prompt").style.height = "auto";
        showStatus("");
        conversation.messages.push({ role: "user", content: prompt });
        if (conversation.title === "Nuevo chat") {
          conversation.title = prompt.slice(0, 32);
          renderHistory();
        }
        renderConversation();

        const loadingRow = document.createElement("div");
        loadingRow.className = "message-row assistant";
        const loadingAvatar = document.createElement("div");
        loadingAvatar.className = "avatar";
        loadingAvatar.textContent = "Z";
        loadingRow.appendChild(loadingAvatar);
        const loadingBubble = document.createElement("div");
        loadingBubble.className = "bubble";
        loadingBubble.textContent = "Zare está pensando...";
        loadingRow.appendChild(loadingBubble);
        $("messages").appendChild(loadingRow);

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: conversation.messages })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Error del servidor.");
          conversation.messages.push({ role: "assistant", content: data.reply || "No recibí una respuesta." });
        } catch (error) {
          conversation.messages.push({ role: "assistant", content: "No pude responder: " + error.message });
        } finally {
          busy = false;
          $("sendButton").disabled = false;
          renderConversation();
        }
      });
    })();
  </script>
</body>
</html>
